<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perlengkapan Berkas - SMART SCHOOL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-4 py-10">

    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-full mb-4">
                <i class="fas fa-folder-open text-2xl text-indigo-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Perlengkapan Berkas</h1>
            <p class="text-slate-500 text-sm" id="pageSubtitle">Unggah dokumen persyaratan pendaftaran untuk <strong id="applicantName">-</strong>.</p>
        </div>

        <!-- Kalau nomor pendaftaran tidak ditemukan -->
        <div id="notFoundBox" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <i class="fas fa-triangle-exclamation text-3xl text-amber-500 mb-3"></i>
            <p class="text-slate-600 mb-4">Nomor pendaftaran tidak ditemukan. Masukkan nomor pendaftaran kamu di bawah.</p>
            <form id="lookupForm" class="flex gap-3 max-w-md mx-auto">
                <input type="text" id="lookupRegNo" required class="flex-1 px-4 py-3 border border-gray-300 rounded-xl" placeholder="Contoh: PPDB-20260728-0001">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 rounded-xl">Cari</button>
            </form>
        </div>

        <div id="uploadBox" class="hidden">
            <div class="bg-indigo-50 rounded-2xl p-4 mb-6 text-center">
                <div class="text-xs text-indigo-500 uppercase font-semibold tracking-wide">Nomor Pendaftaran</div>
                <div id="regNoLabel" class="text-xl font-extrabold text-indigo-700 mt-1">-</div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-8 space-y-6" id="docList">
                <!-- Kartu berkas akan digenerate oleh JS -->
            </div>

            <div class="flex flex-col sm:flex-row gap-3 mt-6">
                <a href="cek-status-ppdb.html" id="checkStatusBtn" class="flex-1 text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl">
                    <i class="fas fa-list-check mr-2"></i>Cek Status Pendaftaran
                </a>
                <a href="index.html" class="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-xl">
                    <i class="fas fa-home mr-2"></i>Beranda
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const DOC_TYPES = [
        { key: 'nik', label: 'Kartu Keluarga / NIK', icon: 'fa-id-card', required: true },
        { key: 'akta_lahir', label: 'Akta Kelahiran', icon: 'fa-file-lines', required: true },
        { key: 'bukti_bayar', label: 'Bukti Pembayaran PPDB', icon: 'fa-receipt', required: true },
        { key: 'lainnya', label: 'Berkas Pendukung Lainnya', icon: 'fa-paperclip', required: false }
    ];

    const params = new URLSearchParams(window.location.search);
    let currentRegNo = params.get('reg') || '';
    let uploadedDocs = {};

    document.addEventListener('DOMContentLoaded', function () {
        if (currentRegNo) {
            loadApplicant(currentRegNo);
        } else {
            document.getElementById('notFoundBox').classList.remove('hidden');
        }
    });

    document.getElementById('lookupForm').addEventListener('submit', function (e) {
        e.preventDefault();
        currentRegNo = document.getElementById('lookupRegNo').value.trim();
        loadApplicant(currentRegNo);
    });

    async function loadApplicant(regNo) {
        try {
            const response = await fetch('/api/admission/documents?registration_no=' + encodeURIComponent(regNo));
            const data = await response.json();

            if (!data.success) {
                document.getElementById('uploadBox').classList.add('hidden');
                document.getElementById('notFoundBox').classList.remove('hidden');
                return;
            }

            document.getElementById('notFoundBox').classList.add('hidden');
            document.getElementById('uploadBox').classList.remove('hidden');
            document.getElementById('applicantName').textContent = data.full_name;
            document.getElementById('regNoLabel').textContent = regNo;
            document.getElementById('checkStatusBtn').href = 'cek-status-ppdb.html?reg=' + encodeURIComponent(regNo);

            uploadedDocs = data.uploaded || {};
            renderDocList();
        } catch (error) {
            console.error('Error loading applicant:', error);
        }
    }

    function renderDocList() {
        const container = document.getElementById('docList');
        container.innerHTML = DOC_TYPES.map(function (doc) {
            const uploaded = uploadedDocs[doc.key];
            return '<div class="border border-gray-100 rounded-xl p-4">' +
                '<div class="flex items-center justify-between mb-3">' +
                '<div class="flex items-center gap-3">' +
                '<div class="w-10 h-10 rounded-lg flex items-center justify-center ' + (uploaded ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-500') + '">' +
                '<i class="fas ' + doc.icon + '"></i></div>' +
                '<div>' +
                '<div class="font-semibold text-slate-800 text-sm">' + doc.label + (doc.required ? ' <span class="text-red-500">*</span>' : ' <span class="text-gray-400 font-normal text-xs">(opsional)</span>') + '</div>' +
                (uploaded ? '<div class="text-xs text-green-600"><i class="fas fa-check mr-1"></i>Sudah diunggah: ' + (uploaded.file_name || '-') + '</div>' : '<div class="text-xs text-gray-400">Belum diunggah</div>') +
                '</div></div></div>' +
                '<input type="file" id="file_' + doc.key + '" accept="image/*,application/pdf" class="text-sm w-full">' +
                '<div id="msg_' + doc.key + '" class="hidden text-xs mt-2 p-2 rounded-lg"></div>' +
                '<button onclick="uploadDoc(\'' + doc.key + '\')" class="mt-3 w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2 rounded-lg text-sm">' +
                '<i class="fas fa-upload mr-2"></i>' + (uploaded ? 'Ganti Berkas' : 'Unggah') +
                '</button></div>';
        }).join('');
    }

    async function uploadDoc(docKey) {
        const fileInput = document.getElementById('file_' + docKey);
        const msgBox = document.getElementById('msg_' + docKey);
        const file = fileInput.files[0];

        if (!file) {
            msgBox.classList.remove('hidden');
            msgBox.className = 'text-xs mt-2 p-2 rounded-lg bg-red-50 text-red-700';
            msgBox.textContent = 'Pilih file terlebih dahulu.';
            return;
        }

        const reader = new FileReader();
        reader.onload = async function (ev) {
            msgBox.classList.remove('hidden');
            msgBox.className = 'text-xs mt-2 p-2 rounded-lg bg-indigo-50 text-indigo-700';
            msgBox.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Mengunggah...';

            try {
                const response = await fetch('/api/admission/documents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        registration_no: currentRegNo,
                        doc_type: docKey,
                        file_name: file.name,
                        file_data: ev.target.result
                    })
                });
                const result = await response.json();
                if (result.success) {
                    uploadedDocs[docKey] = { file_name: file.name, uploaded_at: new Date().toISOString() };
                    renderDocList();
                } else {
                    msgBox.className = 'text-xs mt-2 p-2 rounded-lg bg-red-50 text-red-700';
                    msgBox.textContent = result.error || 'Gagal mengunggah berkas.';
                }
            } catch (error) {
                console.error('Upload error:', error);
                msgBox.className = 'text-xs mt-2 p-2 rounded-lg bg-red-50 text-red-700';
                msgBox.textContent = 'Tidak dapat terhubung ke server.';
            }
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
